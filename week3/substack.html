<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Substack Subscribe</title>
    </head>
    <body>
        <main id="main">
            <section id="subscribe">

                <header id="subscribe-header">
                    <img src="logo.png" alt="Gianmarco Soresi publication logo">

                    <button type="button" id="close">
                        X
                    </button>
                </header>

                <section id="subscribe-content">
                    <h1>Subscribe to Gianmarco Soresi</h1>

                    <p>
                        Already have an account?
                        <a href="#">Sign in</a>
                    </p>

                    <form action="#" method="post">

                        <label for="email">Your email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Your email"
                            required
                        >

                        <div id="agreement">
                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                                required
                            >

                            <label for="terms">
                                By creating an account, I agree to Substack's
                                <a href="#">Terms of Use</a>, and acknowledge it's
                                <a href="#">Information Collection Notice</a>,
                                and <a href="#">Privacy Policy</a>.
                            </label>
                        </div>

                        <button type="submit">
                            Subscribe
                        </button>

                    </form>
                </section>

            </section>
        </main>
    </body>
</html>
